<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Mail Sender App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #f7a7b6);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 15px;
            backdrop-filter: blur(15px);
            border: 1px solid #444;
            transition: transform 0.3s ease-in-out;
        }

        .title {
            font-size: 3em;
            color: #fff;
            text-shadow: 0 0 10px #ff6b6b, 0 0 20px #ff6b6b, 0 0 30px #ff6b6b;
            margin-bottom: 20px;
            letter-spacing: 2px;
            animation: neon 1.5s ease-in-out infinite alternate;
        }

        @keyframes neon {
            0% { text-shadow: 0 0 10px #ff6b6b, 0 0 20px #ff6b6b, 0 0 30px #ff6b6b; }
            100% { text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff6b6b, 0 0 60px #ff6b6b; }
        }

        .input-field {
            width: 70%;
            padding: 15px;
            margin: 15px 0;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: #fff;
            font-size: 1.1em;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
        }

        .input-field:focus {
            background-color: #333;
            border: 2px solid #ff6b6b;
            box-shadow: 0 0 15px #ff6b6b;
        }

        .submit-btn {
            background-color: #ff6b6b;
            color: #fff;
            padding: 10px 15px;
            font-size: 1.3em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 50%;
            margin-top: 25px;
        }

        .submit-btn:hover {
            background-color: #ff4765;
            box-shadow: 0 0 20px #ff6b6b;
        }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            .title { font-size: 2.5em; }
            .input-field, .submit-btn { font-size: 1em; }
        }

        /* Custom Modal Styles */
        .modal-content {
            background: #1f1f1f;
            border-radius: 15px;
            color: #fff;
            border: 2px solid #ff6b6b;
        }

        .modal-header {
            background-color: #ff6b6b;
            color: #fff;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }

        .modal-body {
            background-color: #2c2c2c;
        }

        .modal-footer {
            background-color: #1f1f1f;
        }

        .btn-success {
            background-color: #ff6b6b;
            border-radius: 8px;
        }

        .btn-success:hover {
            background-color: #ff4765;
            box-shadow: 0 0 15px #ff6b6b;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Mail Sender App</h1>
        <form action="/mail" method="post" class="mail-form" enctype="multipart/form-data" onsubmit="showSuccessModal(event)">
            <input type="text" name="to" placeholder="Recipient Emails (comma-separated)" class="input-field" required />
            <input type="text" name="subject" placeholder="Subject" class="input-field" required />
            <textarea name="msg" placeholder="Message (Supports HTML & Links)" class="input-field" required></textarea>
            <input type="file" name="file" class="input-field" />
            <button type="submit" class="submit-btn">Send Mail</button>
        </form>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="successModalLabel">Success</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Your email has been sent successfully! 🎉
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS & Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <script>
        // Function to show the success modal after form submission
        function showSuccessModal(event) {
            event.preventDefault(); // Prevent form from submitting
            var form = event.target;

            // Simulate email sending
            setTimeout(function() {
                // Trigger modal display
                var modal = new bootstrap.Modal(document.getElementById('successModal'));
                modal.show();

                // You can proceed with the form submission via AJAX or other methods
                // form.submit(); // Uncomment if you want to submit the form after the modal appears
            }, 1000); // Simulate a 1-second delay for the "email sending" action
        }
    </script>
</body>
</html>
